[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-pandas-migrator"
version = "1.0.0"
description = "Bulk, review-first migration of pandas Python code to PySpark for Microsoft Fabric"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rajesh Kumar"}]
dependencies = ["libcst>=1.4,<2", "typer>=0.12,<1", "rich>=13,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
fabric-pandas-migrate = "fabric_pandas_migrator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
